services:
  - type: web
    name: whatsapp-finance-bot
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: ALLOWED_PHONE_NUMBER
        sync: false
      - key: SPREADSHEET_ID
        sync: false
      - key: SHEET_NAME
        value: Movimientos
      - key: CURRENCY_SYMBOL
        value: €
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
